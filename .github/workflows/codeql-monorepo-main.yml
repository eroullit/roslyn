# CodeQL monorepo whole-repo scan for the main branch of this fork.
#
# Scans ALL three subprojects on every push to main and on a daily schedule,
# using the `whole-repo` action step which produces the full project matrix
# without requiring a PR diff.

name: "CodeQL monorepo - main branch"

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"  # Daily at 03:00 UTC
  workflow_dispatch:

jobs:
  whole-repo:
    name: Build project matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.whole-repo.outputs.projects }}
    steps:
      - name: Enumerate all projects
        id: whole-repo
        uses: advanced-security/monorepo-code-scanning-action/whole-repo@main
        with:
          projects-json: projects.json

  scan:
    name: Analyze ${{ matrix.project.name }}
    needs: whole-repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.whole-repo.outputs.projects).projects }}
    steps:
      - name: Analyze code
        uses: advanced-security/monorepo-code-scanning-action/scan@main
